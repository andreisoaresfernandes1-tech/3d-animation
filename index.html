<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como construir um túnel</title>
<style>
  :root { --accent: #f5b301; --ink: #ffffff; --panel: rgba(12, 16, 24, 0.72); }
  html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
  body { font-family: "Inter", "Helvetica Neue", Arial, sans-serif; color: var(--ink); }
  #wrap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: center center; overflow: hidden; background: #000; }
  canvas { display: block; }
  .ov { position: absolute; inset: 0; pointer-events: none; }

  #caption { position: absolute; left: 40px; top: 36px; max-width: 560px; padding: 18px 22px 18px 22px;
    background: var(--panel); border-left: 6px solid var(--accent); border-radius: 6px; opacity: 0; }
  #caption .num { font-size: 15px; font-weight: 700; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; }
  #caption .ttl { font-size: 34px; font-weight: 800; line-height: 1.1; margin-top: 4px; }
  #caption .sub { font-size: 18px; line-height: 1.4; margin-top: 10px; color: #dfe6ee; font-weight: 500; }

  #title { position: absolute; left: 0; right: 0; top: 170px; padding: 34px 0 38px; text-align: center; opacity: 0;
    background: linear-gradient(90deg, transparent, rgba(8,10,14,.72) 18%, rgba(8,10,14,.72) 82%, transparent); }
  #title h1 { margin: 0; font-size: 58px; font-weight: 900; letter-spacing: -.01em; text-shadow: 0 4px 24px rgba(0,0,0,.6); }
  #title p { margin: 14px 0 0; font-size: 24px; font-weight: 600; color: var(--accent); text-shadow: 0 2px 12px rgba(0,0,0,.7); }

  #endtitle { position: absolute; left: 0; right: 0; top: 270px; text-align: center; opacity: 0; }
  #endtitle h1 { margin: 0; font-size: 72px; font-weight: 900; text-shadow: 0 4px 30px rgba(0,0,0,.8); }
  #endtitle p { margin: 12px 0 0; font-size: 24px; font-weight: 600; color: var(--accent); }

  .lbl { position: absolute; left: 0; top: 0; opacity: 0; }
  .lbl .dot { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 3px rgba(0,0,0,.45); }
  .lbl .line { position: absolute; height: 2px; background: var(--accent); transform-origin: 0 50%; }
  .lbl .txt { position: absolute; white-space: nowrap; padding: 6px 12px; font-size: 17px; font-weight: 700;
    background: var(--panel); border: 1px solid rgba(245,179,1,.7); border-radius: 4px; transform: translate(-50%, -50%); }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
  #caption.bad { border-left-color: #ff3b30; }
  #caption.bad .num { color: #ff5a4f; }
  #alarm { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 45%, rgba(220,20,20,.75) 100%); }
  #stamp { position: absolute; left: 50%; top: 46%; opacity: 0; font-size: 86px; font-weight: 900; color: #ff3b30;
    border: 8px solid #ff3b30; border-radius: 14px; padding: 4px 30px; background: rgba(255,255,255,.88); white-space: nowrap; }
  #bubble { position: absolute; left: 0; top: 0; opacity: 0; white-space: nowrap; background: #fff; color: #111; font-size: 24px;
    font-weight: 800; padding: 10px 18px; border-radius: 18px; margin: 0; translate: -50% -100%; box-shadow: 0 6px 20px rgba(0,0,0,.35); }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; margin-left: -10px; border: 10px solid transparent;
    border-top-color: #fff; border-bottom: 0; }
  #tries { position: absolute; right: 36px; top: 36px; display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    background: var(--panel); border-radius: 8px; opacity: 0; }
  #tries span { font-size: 14px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #cfd6de; margin-right: 6px; }
  #tries i { font-style: normal; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
    font-size: 15px; border: 2px solid rgba(255,255,255,.35); color: rgba(255,255,255,.55); }
  #tries i.cur { border-color: #fff; color: #fff; }
  #tries i.bad { background: #ff3b30; border-color: #ff3b30; color: #fff; }
  #tries i.ok { background: #1f9d55; border-color: #1f9d55; color: #fff; }
  #rewind { position: absolute; inset: 0; opacity: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 2px, rgba(0,0,0,.12) 2px 5px); }
  #rewind .tag { position: absolute; right: 48px; top: 40px; font-size: 44px; font-weight: 900; color: #fff;
    text-shadow: 0 0 12px rgba(0,0,0,.8); letter-spacing: .06em; }
  #rewind .msg { position: absolute; left: 0; right: 0; bottom: 90px; text-align: center; font-size: 40px; font-weight: 800;
    text-shadow: 0 3px 16px rgba(0,0,0,.9); }
  #good { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); opacity: 0; white-space: nowrap;
    background: #1f9d55; color: #fff; font-size: 46px; font-weight: 900; padding: 16px 36px; border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #progress { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--accent); width: 0; }

  #controls { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px;
    align-items: center; background: rgba(20,24,32,.85); padding: 8px 14px; border-radius: 8px; font-size: 14px; }
  #controls button { background: var(--accent); border: 0; border-radius: 4px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
  #controls input { width: min(60vw, 520px); }
  body.render #controls { display: none; }

  /* ---------- formato vertical 9:16 ---------- */
  body.vertical #stage { width: 720px; height: 1280px; }
  body.vertical #caption { left: 28px; right: 28px; top: 40px; max-width: none; padding: 20px 24px; }
  body.vertical #caption .ttl { font-size: 40px; }
  body.vertical #caption .sub { font-size: 22px; }
  body.vertical #title { top: 380px; padding: 40px 30px 44px; }
  body.vertical #title h1 { font-size: 60px; line-height: 1.08; }
  body.vertical #title p { font-size: 28px; }
  body.vertical #endtitle { top: 480px; padding: 0 30px; }
  body.vertical #endtitle h1 { font-size: 66px; }
  body.vertical #endtitle p { font-size: 26px; }
  body.vertical #tries { right: auto; left: 50%; top: auto; bottom: 64px; transform: translateX(-50%); }
  body.vertical #tries i { width: 38px; height: 38px; font-size: 18px; }
  body.vertical #stamp { font-size: 64px; top: 52%; }
  body.vertical #good { top: 560px; font-size: 38px; }
  body.vertical #rewind .tag { right: 50%; transform: translateX(50%); top: 60px; white-space: nowrap; }
  body.vertical #rewind .msg { bottom: 220px; font-size: 44px; }
  body.vertical .lbl .txt { font-size: 19px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="ov" id="labels"></div>
    <div class="ov">
      <div id="title"><h1>Como construir um túnel subterrâneo</h1><p>Parece fácil: é só cavar… será?</p></div>
      <div id="caption"><div class="num"></div><div class="ttl"></div><div class="sub"></div></div>
      <div id="endtitle"><h1>Túnel concluído!</h1><p>Na 6ª tentativa, ele finalmente aguenta o peso da terra</p></div>
      <div id="alarm"></div>
      <div id="stamp">✗ DESABOU!</div>
      <div id="bubble"></div>
      <div id="tries"><span>Tentativas</span><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i></div>
      <div id="rewind"><div class="tag">◀◀ REBOBINANDO</div><div class="msg">Tentar de novo!</div></div>
      <div id="good">✔ Tentativa 6: agora vai!</div>
      <div id="progress"></div>
      <div id="fade"></div>
    </div>
  </div>
</div>
<div id="controls">
  <button id="play">⏸</button>
  <input id="scrub" type="range" min="0" max="136.5" step="0.01" value="0">
  <span id="time">0.0s</span>
</div>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
